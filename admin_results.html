<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Premium Natijalar (Reyting)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0b131a; color: #e2e8f0; padding: 20px; min-height: 100vh; }
        
        .admin-container { max-width: 1000px; margin: 0 auto; }
        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px; background: #14222d; border-radius: 20px; 
            border: 1px solid #ffd700; margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        header h1 { color: #ffd700; font-size: 22px; letter-spacing: 1px; }
        .counter-badge { background: rgba(255, 215, 0, 0.1); color: #ffd700; padding: 6px 15px; border-radius: 30px; font-weight: bold; font-size: 14px; border: 1px solid rgba(255,215,0,0.3); }

        /* --- REYTING JADVALI --- */
        .table-responsive { width: 100%; overflow-x: auto; background: #14222d; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .results-table { width: 100%; border-collapse: collapse; text-align: left; }
        .results-table th, .results-table td { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        .results-table th { background: rgba(255, 215, 0, 0.03); color: #ffd700; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        .results-table tr:hover { background: rgba(255,255,255,0.02); }

        /* --- O'RINLAR KLASSI (MEDALLAR) --- */
        .rank { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; font-size: 15px; }
        .rank-1 { background: #ffd700; color: #000; box-shadow: 0 0 10px rgba(255,215,0,0.4); }
        .rank-2 { background: #c0c0c0; color: #000; box-shadow: 0 0 10px rgba(192,192,192,0.4); }
        .rank-3 { background: #cd7f32; color: #000; box-shadow: 0 0 10px rgba(205,127,50,0.4); }
        .rank-other { background: rgba(255,255,255,0.05); color: #fff; }

        .student-info { font-weight: 600; color: #fff; }
        .student-id { font-size: 11px; opacity: 0.4; font-family: monospace; display: block; margin-top: 2px; }
        
        .score-badge { font-weight: 700; color: #00ff00; font-size: 16px; }
        .date-time { font-size: 13px; opacity: 0.7; }

        .loader { text-align: center; padding: 40px; color: #ffd700; font-weight: bold; }
        .empty-msg { text-align: center; padding: 40px; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="admin-container">
        <header>
            <h1>🏆 PREMIUM IMTIHON REYTINGI</h1>
            <div class="counter-badge" id="total-count">Jami: 0 ta</div>
        </header>

        <div class="table-responsive">
            <table class="results-table">
                <thead>
                    <tr>
                        <th style="width: 80px;">O'rin</th>
                        <th>Talaba (Ismi va ID)</th>
                        <th>To'plagan Bali</th>
                        <th>Sana va Vaqt</th>
                    </tr>
                </thead>
                <tbody id="results-list">
                    <tr>
                        <td colspan="4" class="loader">Natijalar yuklanmoqda...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK Modullari -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2G8cD0JezEKXRCtKLYiZL0bzDyTp06Vs",
            authDomain: "quiz-app-3692d.firebaseapp.com",
            projectId: "quiz-app-3692d",
            storageBucket: "quiz-app-3692d.firebasestorage.app",
            messagingSenderId: "526836020845",
            appId: "1:526836020845:android:3ea991380c104c75e8b164"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Natijalarni ball bo'yicha eng yuqoridan pastga qarab real vaqtda olish (Realtime Query)
        const q = query(collection(db, "premium_results"), orderBy("totalScore", "desc"));

        onSnapshot(q, (snapshot) => {
            const tbody = document.getElementById('results-list');
            const totalCountElem = document.getElementById('total-count');
            
            tbody.innerHTML = "";
            totalCountElem.innerText = `Jami: ${snapshot.size} ta`;

            if (snapshot.empty) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-msg">Hozircha premium imtihon topshirganlar yo'q.</td></tr>`;
                return;
            }

            let rank = 1;

            snapshot.forEach((doc) => {
                const data = doc.data();
                const row = document.createElement('tr');

                // O'rinlarni aniqlash va mos rangli klass berish (1, 2, 3-o'rinlar uchun medal stilida)
                let rankClass = "rank-other";
                if (rank === 1) rankClass = "rank-1";
                else if (rank === 2) rankClass = "rank-2";
                else if (rank === 3) rankClass = "rank-3";

                // Firebase'dan kelgan vaqtni o'qiladigan shaklga keltirish (Sana va Soat:Minut:Sekund)
                let formattedDate = "---";
                if (data.timestamp) {
                    const date = data.timestamp.toDate();
                    const day = String(date.getDate()).padStart(2, '0');
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const year = date.getFullYear();
                    const hours = String(date.getHours()).padStart(2, '0');
                    const minutes = String(date.getMinutes()).padStart(2, '0');
                    const seconds = String(date.getSeconds()).padStart(2, '0');
                    
                    formattedDate = `${day}.${month}.${year} | ${hours}:${minutes}:${seconds}`;
                }

                row.innerHTML = `
                    <td>
                        <span class="rank ${rankClass}">${rank}</span>
                    </td>
                    <td>
                        <span class="student-info">${data.studentName}</span>
                        <span class="student-id">ID: ${data.studentID}</span>
                    </td>
                    <td>
                        <span class="score-badge">${Number(data.totalScore).toFixed(1)} ball</span>
                    </td>
                    <td>
                        <span class="date-time">${formattedDate}</span>
                    </td>
                `;

                tbody.appendChild(row);
                rank++; // Keyingi talaba uchun o'rinni bittaga oshirish
            });
        }, (error) => {
            console.error("Xatolik yuz berdi:", error);
            document.getElementById('results-list').innerHTML = `<tr><td colspan="4" class="empty-msg" style="color:red;">Xatolik: Ma'lumotlarni yuklab bo'lmadi!</td></tr>`;
        });
    </script>
</body>
</html>
