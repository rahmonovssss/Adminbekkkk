<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Premium Natijalar (Reyting)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- PDF yuklash uchun zaruriy kutubxonalar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0b131a; color: #e2e8f0; padding: 20px; min-height: 100vh; }
        
        .admin-container { max-width: 1050px; margin: 0 auto; }
        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px; background: #14222d; border-radius: 20px; 
            border: 1px solid #ffd700; margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            flex-wrap: wrap; gap: 15px;
        }
        header h1 { color: #ffd700; font-size: 22px; letter-spacing: 1px; }
        
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .counter-badge { background: rgba(255, 215, 0, 0.1); color: #ffd700; padding: 8px 18px; border-radius: 30px; font-weight: bold; font-size: 14px; border: 1px solid rgba(255,215,0,0.3); }
        
        .btn-pdf { 
            background: #ff4b2b; color: white; border: none; padding: 8px 18px; 
            border-radius: 30px; font-weight: 600; cursor: pointer; display: flex; 
            align-items: center; gap: 8px; transition: 0.2s; font-size: 14px;
        }
        .btn-pdf:hover { background: #ff330c; transform: translateY(-2px); }

        /* --- REYTING JADVALI --- */
        .table-responsive { width: 100%; overflow-x: auto; background: #14222d; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .results-table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
        .results-table th, .results-table td { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        .results-table th { background: rgba(255, 215, 0, 0.03); color: #ffd700; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        .results-table tr:hover { background: rgba(255,255,255,0.02); }

        /* --- O'RINLAR STYLE --- */
        .rank { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; font-size: 14px; }
        .rank-1 { background: #ffd700; color: #000; box-shadow: 0 0 10px rgba(255,215,0,0.4); }
        .rank-2 { background: #c0c0c0; color: #000; box-shadow: 0 0 10px rgba(192,192,192,0.4); }
        .rank-3 { background: #cd7f32; color: #000; box-shadow: 0 0 10px rgba(205,127,50,0.4); }
        .rank-other { background: rgba(255,255,255,0.05); color: #fff; }

        .student-info { font-weight: 600; color: #fff; font-size: 15px; }
        .student-id { font-size: 12px; color: #ffd700; font-family: monospace; display: block; margin-top: 2px; font-weight: bold; }
        
        .subjects-badge { font-size: 12px; opacity: 0.7; background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 6px; display: inline-block; margin-top: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .score-badge { font-weight: 700; color: #00ff00; font-size: 16px; }
        .date-time { font-size: 13px; opacity: 0.6; }

        /* --- PUL MUKOFOTI CHIPLARI --- */
        .prize-badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .prize-1 { background: rgba(255, 215, 0, 0.15); color: #ffd700; border: 1px solid #ffd700; }
        .prize-2 { background: rgba(0, 255, 0, 0.15); color: #00ff00; border: 1px solid #00ff00; }
        .prize-none { color: #556575; font-size: 12px; }

        .loader { text-align: center; padding: 40px; color: #ffd700; font-weight: bold; }
        .empty-msg { text-align: center; padding: 40px; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="admin-container">
        <header>
            <h1>🏆 PREMIUM BLOK TEST: TOP-10</h1>
            <div class="header-actions">
                <button class="btn-pdf" onclick="exportToPDF()">📄 PDF YUKLASH</button>
                <div class="counter-badge" id="total-count">Top-10</div>
            </div>
        </header>

        <div class="table-responsive">
            <table class="results-table" id="table-to-print">
                <thead>
                    <tr>
                        <th style="width: 70px;">O'rin</th>
                        <th>Talaba va ID</th>
                        <th>Tanlangan Blok Fanlari</th>
                        <th>To'plagan Bali</th>
                        <th>Mukofot Jamg'armasi</th>
                        <th>Topshirilgan Vaqt</th>
                    </tr>
                </thead>
                <tbody id="results-list">
                    <tr>
                        <td colspan="6" class="loader">Xavfsiz ma'lumotlar yuklanmoqda...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2G8cD0JezEKXRCtKLYiZL0bzDyTp06Vs",
            authDomain: "quiz-app-3692d.firebaseapp.com",
            projectId: "quiz-app-3692d",
            storageBucket: "quiz-app-3692d.firebasestorage.app",
            messagingSenderId: "526836020845",
            appId: "1:526836020845:android:3ea991380c104c75e8b164"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Mukofot pullarini belgilash (O'zingiz o'zgartirishingiz mumkin)
        const prizeMoney = {
            1: "150,000 UZS",
            2: "100,000 UZS",
            3: "70,000 UZS",
            4: "50,000 UZS",
            5: "30,000 UZS"
        };

        // Global massiv (PDF yuklashda foydalanish uchun)
        window.finalRankedData = [];

        // Realtime snapshot olish
        const resultsQuery = query(collection(db, "premium_results"), orderBy("totalScore", "desc"));

        onSnapshot(resultsQuery, async (snapshot) => {
            const tbody = document.getElementById('results-list');
            
            if (snapshot.empty) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-msg">Hozircha premium natijalar mavjud emas.</td></tr>`;
                return;
            }

            // 1. Foydalanuvchilarning 6 xonalik maxsus ID raqamlarini keshlab olish
            const usersMap = {};
            try {
                const usersSnap = await getDocs(collection(db, "users"));
                usersSnap.forEach(uDoc => {
                    const uData = uDoc.data();
                    // Foydalanuvchining 6 xonalik IDsi (masalan: data.myId yoki siz qo'ygan maydon nomi)
                    usersMap[uDoc.id] = uData.myId || uData.studentId || "Mavjud emas";
                });
            } catch (err) {
                console.error("Foydalanuvchilarni o'qishda xato:", err);
            }

            // 2. Talaba bo'yicha eng yuqori ballni filtrlash (Faqat 1 ta eng yaxshi natija qoladi)
            const uniqueStudents = {};
            snapshot.forEach((doc) => {
                const data = doc.data();
                const sID = data.studentID; // user.uid qiymati

                if (!uniqueStudents[sID] || uniqueStudents[sID].totalScore < data.totalScore) {
                    uniqueStudents[sID] = data;
                }
            });

            // 3. Obyektdan massiv yasab, qayta tartiblash va faqat Top-10 ni ajratib olish
            const sortedResults = Object.values(uniqueStudents)
                .sort((a, b) => b.totalScore - a.totalScore)
                .slice(0, 10);

            tbody.innerHTML = "";
            window.finalRankedData = []; // Tozalash

            let rank = 1;
            sortedResults.forEach((data) => {
                const row = document.createElement('tr');

                // Medallar klassi
                let rankClass = "rank-other";
                if (rank === 1) rankClass = "rank-1";
                else if (rank === 2) rankClass = "rank-2";
                else if (rank === 3) rankClass = "rank-3";

                // Mukofotni hisoblash
                let prizeHTML = `<span class="prize-none">—</span>`;
                let prizeText = "—";
                if (rank <= 5) {
                    prizeHTML = `<span class="prize-badge ${rank === 1 ? 'prize-1' : 'prize-2'}">🎁 ${prizeMoney[rank]}</span>`;
                    prizeText = prizeMoney[rank];
                }

                // Dinamik 6 xonalik IDni bog'lash
                const sixDigitID = usersMap[data.studentID] || "Aniqlanmadi";

                // Fan bloklarini ajratib ko'rsatish
                let blockSubjects = "Majburiy fanlar";
                if (data.subjects) {
                    const subs = Object.keys(data.subjects).filter(s => s.includes("blok"));
                    if(subs.length > 0) blockSubjects = subs.join(" va ");
                }

                // Vaqtni formatlash
                let formattedDate = "---";
                if (data.timestamp) {
                    const date = data.timestamp.toDate();
                    formattedDate = `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')}.${date.getFullYear()} | ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                }

                row.innerHTML = `
                    <td><span class="rank ${rankClass}">${rank}</span></td>
                    <td>
                        <span class="student-info">${data.studentName}</span>
                        <span class="student-id">ID: ${sixDigitID}</span>
                    </td>
                    <td><span class="subjects-badge">${blockSubjects}</span></td>
                    <td><span class="score-badge">${Number(data.totalScore).toFixed(1)}</span></td>
                    <td>${prizeHTML}</td>
                    <td><span class="date-time">${formattedDate}</span></td>
                `;

                tbody.appendChild(row);

                // PDF uchun ma'lumotlarni saqlab borish
                window.finalRankedData.push({
                    rank: rank,
                    name: `${data.studentName} (${sixDigitID})`,
                    subjects: blockSubjects,
                    score: Number(data.totalScore).toFixed(1),
                    prize: prizeText,
                    date: formattedDate
                });

                rank++;
            });
        });

        // PDF yaratish va yuklab olish mantiqi
        window.exportToPDF = () => {
            if (!window.finalRankedData || window.finalRankedData.length === 0) {
                alert("Yuklash uchun ma'lumotlar yetarli emas!");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Sarlavha yozish
            doc.setFont("Helvetica", "bold");
            doc.setFontSize(18);
            doc.text("PREMIUM BLOK TEST YAKUNIY REYTINGI (TOP-10)", 14, 20);
            
            doc.setFontSize(10);
            doc.setFont("Helvetica", "normal");
            doc.text(`Sana: ${new Date().toLocaleDateString()} | Dr. Rahmonov Avtomatlashtirilgan Tizimi`, 14, 27);

            // Jadval ustunlari
            const tableColumn = ["O'rin", "Talaba (Ismi va ID)", "Tanlangan Fan Bloklari", "To'plagan Bali", "Yutuq Miqdori", "Sana / Vaqt"];
            const tableRows = [];

            window.finalRankedData.forEach(item => {
                const rowData = [
                    item.rank,
                    item.name,
                    item.subjects,
                    item.score,
                    item.prize,
                    item.date
                ];
                tableRows.push(rowData);
            });

            // AutoTable orqali chiroyli PDF generatsiya qilish
            doc.autoTable({
                startY: 35,
                head: [tableColumn],
                body: tableRows,
                theme: 'striped',
                headStyles: { fillColor: [20, 34, 45], textColor: [255, 215, 0], fontStyle: 'bold' },
                styles: { fontSize: 9, font: "Helvetica" },
                columnStyles: {
                    0: { cellWidth: 15, halign: 'center' },
                    3: { fontStyle: 'bold', textColor: [0, 180, 0] },
                    4: { fontStyle: 'bold' }
                }
            });

            // Faylni saqlash
            doc.save(`Premium_Top10_Reyting_${new Date().toISOString().slice(0,10)}.pdf`);
        };
    </script>
</body>
</html>
