<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Premium Natijalar (Reyting)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0b131a; color: #e2e8f0; padding: 20px; min-height: 100vh; }
        
        .admin-container { max-width: 1100px; margin: 0 auto; }
        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px; background: #14222d; border-radius: 20px; 
            border: 1px solid #ffd700; margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            flex-wrap: wrap; gap: 15px;
        }
        header h1 { color: #ffd700; font-size: 22px; letter-spacing: 1px; }
        
        .header-actions { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        
        /* --- FILTR VA BUTTON STYLES --- */
        .combo-select {
            background: #0b131a; color: #ffd700; border: 1px solid #ffd700;
            padding: 10px 15px; border-radius: 12px; font-weight: 600; outline: none; cursor: pointer;
            min-width: 250px;
        }
        .btn-pdf {
            background: #ff4b2b; color: white; border: none; padding: 10px 20px;
            border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;
            transition: 0.2s; box-shadow: 0 4px 15px rgba(255, 75, 43, 0.3);
        }
        .btn-pdf:hover { background: #e03e1f; }

        /* --- REYTING JADVALI --- */
        .table-responsive { width: 100%; overflow-x: auto; background: #14222d; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .results-table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
        .results-table th, .results-table td { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        .results-table th { background: rgba(255, 215, 0, 0.03); color: #ffd700; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        .results-table tr.clickable-row { cursor: pointer; transition: 0.2s; }
        .results-table tr.clickable-row:hover { background: rgba(255, 215, 0, 0.04); }

        /* --- O'RINLAR KLASSI (MEDALLAR) --- */
        .rank { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; font-size: 14px; }
        .rank-1 { background: #ffd700; color: #000; box-shadow: 0 0 10px rgba(255,215,0,0.4); }
        .rank-2 { background: #c0c0c0; color: #000; box-shadow: 0 0 10px rgba(192,192,192,0.4); }
        .rank-3 { background: #cd7f32; color: #000; box-shadow: 0 0 10px rgba(205,127,50,0.4); }
        .rank-other { background: rgba(255,255,255,0.05); color: #fff; }

        .student-info { font-weight: 600; color: #fff; font-size: 15px; }
        .student-id { font-size: 12px; color: #ffd700; font-family: monospace; display: block; margin-top: 2px; font-weight: bold; }
        
        .subject-block { display: flex; flex-direction: column; gap: 4px; }
        .block-tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600; width: max-content; }
        .block-1 { background: rgba(0, 210, 255, 0.15); color: #00d2ff; border: 1px solid rgba(0, 210, 255, 0.3); }
        .block-2 { background: rgba(168, 85, 247, 0.15); color: #a855f7; border: 1px solid rgba(168, 85, 247, 0.3); }
        .block-none { color: #6b7280; font-style: italic; font-size: 13px; }

        .score-badge { font-weight: 700; color: #00ff00; font-size: 16px; }
        .date-time { font-size: 13px; opacity: 0.6; }
        
        .action-hint { font-size: 11px; background: rgba(0, 255, 0, 0.1); color: #00ff00; padding: 2px 6px; border-radius: 4px; margin-left: 8px; font-weight: normal; }

        .loader { text-align: center; padding: 40px; color: #ffd700; font-weight: bold; }
        .empty-msg { text-align: center; padding: 40px; opacity: 0.5; }

        /* --- PUL O'TKAZISH MODALI --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 2000;
            backdrop-filter: blur(5px);
        }
        .modal-content { 
            background: #14222d; padding: 30px; border-radius: 25px; 
            width: 90%; max-width: 420px; border: 1px solid #ffd700; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .admin-input {
            width: 100%; padding: 15px; margin: 15px 0;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: white; outline: none; text-align: center; font-size: 18px; font-weight: bold;
        }
        .modal-btns { display: flex; gap: 12px; margin-top: 10px; }
        .btn-confirm { flex: 1; padding: 14px; background: #00ff00; border: none; border-radius: 12px; color: #000; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-cancel { flex: 1; padding: 14px; background: #333; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; font-size: 15px; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf-plugin-autotable.min.js"></script>
</head>
<body>

    <div class="admin-container">
        <header>
            <h1>🏆 PREMIUM BLOK REYTINGI</h1>
            <div class="header-actions">
                <select id="subject-filter" class="combo-select">
                    <option value="all">Barcha Kombinatsiyalar</option>
                </select>
                
                <button id="download-pdf-btn" class="btn-pdf">📄 PDF YUKLAB OLISH</button>
            </div>
        </header>

        <div class="table-responsive">
            <table class="results-table" id="rating-table">
                <thead>
                    <tr>
                        <th style="width: 70px;">O'rin</th>
                        <th>Talaba va ID</th>
                        <th>Tanlangan Blok Fanlari</th>
                        <th>To'plagan Bali</th>
                        <th>Topshirilgan Vaqt</th>
                    </tr>
                </thead>
                <tbody id="results-list">
                    <tr>
                        <td colspan="5" class="loader">Tizim tahlil qilinmoqda, kuting...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #ffd700;">🎁 Pul Mukofoti Yuborish</h3>
            <p id="modal-student-name" style="margin-top: 10px; font-weight: 600; font-size: 16px;"></p>
            <p id="modal-student-id" style="font-size: 13px; color: #00d2ff; font-family: monospace;"></p>
            
            <input type="number" id="prize-amount" class="admin-input" placeholder="Summani kiriting (UZS)">
            
            <div class="modal-btns">
                <button class="btn-confirm" id="pay-confirm-btn" onclick="processPayment()">✓ PUL O'TKAZISH</button>
                <button class="btn-cancel" onclick="closePaymentModal()">YOPISH</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2G8cD0JezEKXRCtKLYiZL0bzDyTp06Vs",
            authDomain: "quiz-app-3692d.firebaseapp.com",
            projectId: "quiz-app-3692d",
            storageBucket: "quiz-app-3692d.firebasestorage.app",
            messagingSenderId: "526836020845",
            appId: "1:526836020845:android:3ea991380c104c75e8b164"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedUserDocId = ""; 
        let globalCachedUsers = {}; 
        let rawFirebaseData = [];   

        const filterSelect = document.getElementById('subject-filter');
        const downloadPdfBtn = document.getElementById('download-pdf-btn');

        const q = query(collection(db, "premium_results"), orderBy("totalScore", "desc"));

        onSnapshot(q, async (snapshot) => {
            if (snapshot.empty) {
                document.getElementById('results-list').innerHTML = `<tr><td colspan="5" class="empty-msg">Hozircha premium test topshirganlar mavjud emas.</td></tr>`;
                return;
            }

            rawFirebaseData = snapshot.docs.map(doc => doc.data());

            try {
                const usersSnap = await getDocs(collection(db, "users"));
                usersSnap.forEach(uDoc => {
                    globalCachedUsers[uDoc.id] = uDoc.data().studentID || "Yo'q"; 
                });
            } catch (err) {
                console.error("Foydalanuvchilarni yuklashda xatolik:", err);
            }

            // --- JADVAL VA FILTRNI YANGILASH ---
            updateFilterDropdown();
            renderLeaderboard();
        });

        filterSelect.addEventListener('change', renderLeaderboard);

        // Bazadagi ma'lumotlardan kelib chiqib dynamic tarzda kombinatsiyalar ro'yxatini yaratish
        function updateFilterDropdown() {
            const currentSelected = filterSelect.value; // Hozirgi tanlangan qiymatni saqlab turish
            const uniqueCombos = new Set();

            rawFirebaseData.forEach(data => {
                let b1 = "";
                let b2 = "";
                if (data.subjects) {
                    Object.keys(data.subjects).forEach(name => {
                        if (name.includes("(1-blok)")) b1 = name.replace("(1-blok)", "").trim();
                        if (name.includes("(2-blok)")) b2 = name.replace("(2-blok)", "").trim();
                    });
                }
                if (b1 && b2) {
                    uniqueCombos.add(`${b1} va ${b2}`);
                }
            });

            // Select ichini tozalash va default qiymatni qayta yozish
            filterSelect.innerHTML = `<option value="all">Barcha Kombinatsiyalar</option>`;
            
            // Tartiblangan holda selectga yangi topilgan kombinatsiyalarni qo'shish
            Array.from(uniqueCombos).sort().forEach(combo => {
                const option = document.createElement('option');
                option.value = combo;
                option.innerText = combo;
                filterSelect.appendChild(option);
            });

            // Agar eski tanlangan kombinatsiya yangi ro'yxatda ham bo'lsa, uni saqlab qolamiz
            if (uniqueCombos.has(currentSelected)) {
                filterSelect.value = currentSelected;
            }
        }

        function renderLeaderboard() {
            const tbody = document.getElementById('results-list');
            const selectedCombo = filterSelect.value;

            const uniqueResults = {};

            rawFirebaseData.forEach((data) => {
                const studentUID = data.studentID;

                let b1 = "";
                let b2 = "";
                if (data.subjects) {
                    Object.keys(data.subjects).forEach(name => {
                        if (name.includes("(1-blok)")) b1 = name.replace("(1-blok)", "").trim();
                        if (name.includes("(2-blok)")) b2 = name.replace("(2-blok)", "").trim();
                    });
                }
                
                const currentComboName = (b1 && b2) ? `${b1} va ${b2}` : "Boshqa";
                data.calculatedCombo = currentComboName;
                data.b1 = b1;
                data.b2 = b2;

                if (selectedCombo === 'all' || selectedCombo === currentComboName) {
                    if (!uniqueResults[studentUID] || uniqueResults[studentUID].totalScore < data.totalScore) {
                        uniqueResults[studentUID] = data;
                    }
                }
            });

            const filteredTop10 = Object.values(uniqueResults)
                .sort((a, b) => b.totalScore - a.totalScore)
                .slice(0, 10);

            tbody.innerHTML = "";
            
            if (filteredTop10.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-msg">Ushbu blok kombinatsiyasi bo'yicha TOP-10 natija topilmadi.</td></tr>`;
                return;
            }

            let rank = 1;
            filteredTop10.forEach((data) => {
                const row = document.createElement('tr');
                row.className = "clickable-row";
                
                const sixDigitID = globalCachedUsers[data.studentID] || "Mavjud emas";
                row.onclick = () => openPaymentModal(data.studentName, sixDigitID, data.studentID);

                let rankClass = "rank-other";
                if (rank === 1) rankClass = "rank-1";
                else if (rank === 2) rankClass = "rank-2";
                else if (rank === 3) rankClass = "rank-3";

                let subjectsHTML = "";
                if (data.b1 || data.b2) {
                    subjectsHTML = `
                        <div class="subject-block">
                            ${data.b1 ? `<span class="block-tag block-1">1-Blok: ${data.b1}</span>` : ''}
                            ${data.b2 ? `<span class="block-tag block-2">2-Blok: ${data.b2}</span>` : ''}
                        </div>
                    `;
                } else {
                    subjectsHTML = `<span class="block-none">Fanlar aniqlanmadi</span>`;
                }

                let formattedDate = "---";
                if (data.timestamp) {
                    const date = data.timestamp.toDate();
                    formattedDate = `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')}.${date.getFullYear()} | ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                }

                row.innerHTML = `
                    <td><span class="rank ${rankClass}">${rank}</span></td>
                    <td>
                        <span class="student-info">${data.studentName}</span> <span class="action-hint">💸 To'lash</span>
                        <span class="student-id">ID: ${sixDigitID}</span>
                    </td>
                    <td>${subjectsHTML}</td>
                    <td><span class="score-badge">${Number(data.totalScore).toFixed(1)} ball</span></td>
                    <td><span class="date-time">${formattedDate}</span></td>
                `;

                tbody.appendChild(row);
                data.currentRank = rank; 
                rank++;
            });

            downloadPdfBtn.onclick = () => exportToPDF(filteredTop10, selectedCombo);
        }

        // --- PDF GENERATSIYA TIZIMI ---
        function exportToPDF(dataList, comboName) {
            const { jsPDF } = window.jspdf;
            const docPdf = new jsPDF();

            const titleName = comboName === 'all' ? "BARCHA BLOK FANLARI REYTINGI" : `${comboName.toUpperCase()} REYTINGI`;

            docPdf.setFont("Helvetica", "bold");
            docPdf.setFontSize(16);
            docPdf.text("PREMIUM IMTIHON NATIJALARI (TOP-10)", 14, 20);
            
            docPdf.setFontSize(12);
            docPdf.setFont("Helvetica", "normal");
            docPdf.text(`Kombinatsiya: ${titleName}`, 14, 28);
            docPdf.text(`Sana: ${new Date().toLocaleDateString()} | Admin: Dr. Rahmonov`, 14, 34);

            const tableHeaders = [["O'rin", "Talaba Ismi", "6 xonali ID", "To'plagan Bali", "Topshirilgan Sana va Vaqt"]];
            const tableRows = [];

            dataList.forEach((item) => {
                const sixID = globalCachedUsers[item.studentID] || "—";
                let formattedDate = "---";
                if (item.timestamp) {
                    const date = item.timestamp.toDate();
                    formattedDate = `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')}.${date.getFullYear()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
                }

                tableRows.push([
                    `${item.currentRank}-o'rin`,
                    item.studentName,
                    sixID,
                    `${Number(item.totalScore).toFixed(1)} ball`,
                    formattedDate
                ]);
            });

            docPdf.autoTable({
                startY: 40,
                head: tableHeaders,
                body: tableRows,
                theme: 'striped',
                headStyles: { fillColor: [20, 34, 45], textColor: [255, 215, 0], fontStyle: 'bold' },
                styles: { fontSize: 10, cellPadding: 4 },
                columnStyles: {
                    0: { fontStyle: 'bold', width: 20 },
                    3: { fontStyle: 'bold', textColor: [0, 150, 0] }
                }
            });

            const fileName = `${comboName.replace(/\s+/g, '_')}_TOP10_Reyting.pdf`;
            docPdf.save(fileName);
        }

        // --- TO'LOV MODALI ---
        window.openPaymentModal = (name, sixID, userUID) => {
            selectedUserDocId = userUID; 
            document.getElementById('modal-student-name').innerText = "Talaba: " + name;
            document.getElementById('modal-student-id').innerText = "6 xonali ID: " + sixID;
            document.getElementById('prize-amount').value = "";
            document.getElementById('paymentModal').style.display = 'flex';
        };

        window.closePaymentModal = () => {
            document.getElementById('paymentModal').style.display = 'none';
        };

        window.processPayment = async () => {
            const amountInput = document.getElementById('prize-amount').value;
            const btn = document.getElementById('pay-confirm-btn');
            
            const amount = parseFloat(amountInput);
            if (!amount || amount <= 0) {
                alert("Iltimos, to'g'ri pul miqdorini kiriting!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "YUBORILMOQDA...";

            try {
                const userRef = doc(db, "users", selectedUserDocId);
                await updateDoc(userRef, {
                    balance: increment(amount) 
                });

                alert(`Muvaffaqiyatli yakunlandi! ✅\nTalabaning hisobiga ${amount.toLocaleString()} UZS qo'shildi.`);
                closePaymentModal();
            } catch (err) {
                console.error("Pul o'tkazishda xatolik:", err);
                alert("Xatolik yuz berdi: Foydalanuvchi hujjati topilmadi!");
            } finally {
                btn.disabled = false;
                btn.innerText = "✓ PUL O'TKAZISH";
            }
        };
    </script>
</body>
</html>
